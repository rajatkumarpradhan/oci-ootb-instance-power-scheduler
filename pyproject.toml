[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-ootb-instance-power-scheduler"
version = "0.1.0"
description = "OCI Resource Scheduler power templates plus an offline schedule plan validator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-ootb-instance-power-scheduler = "oci_ootb_instance_power_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
